[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-art-skills"
version = "0.1.0"
description = "Ateliê de pixel art para agentes de IA: técnica guardada no motor, arte saindo de receitas curtas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gustavo Victor" }]
keywords = ["pixel-art", "parallax", "paleta", "sprite", "mcp", "agentes-de-ia", "claude-code", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/guavovic/pixel-art-skills"
Documentation = "https://github.com/guavovic/pixel-art-skills/blob/main/docs/referencia.md"
Repository = "https://github.com/guavovic/pixel-art-skills"
Issues = "https://github.com/guavovic/pixel-art-skills/issues"

[project.scripts]
pixel-atelier = "pixel_atelier.__main__:main"

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8", "mcp>=2.3,<3"]

[tool.setuptools.packages.find]
include = ["pixel_atelier*"]

[tool.setuptools.package-data]
pixel_atelier = ["estilos/*.json", "guia/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
