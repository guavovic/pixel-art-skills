# Arquivo gerado por scripts/embalar.py a partir de AGENTS.md, pixel_atelier/guia/, pixel_atelier/servidor.py e pyproject.toml. Não edite à mão: mude a fonte e rode o script de novo.
# Sem cwd, o Codex sobe o servidor na pasta da sessão (onde abriu, ou a de --cd), que vira a raiz;
# para outra raiz, acrescente "--raiz", "<pasta>" em args.
[mcp_servers.pixel-atelier]
command = "python"
args = ["-m", "pixel_atelier", "mcp"]
